<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google.home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <nav class="left-links" aria-label="About Google">
            <a href="#">About</a>
            <a href="#">Store</a>
        </nav>

        <nav class="right-links" aria-label="Google services">
            <a href="#">Gmail</a>
            <a href="#">Images</a>

            <button class="menu-icon" type="button"
                    title="Google apps" aria-label="Google apps"><span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
              
            </button>

            <a class="profile-pic" href="#" aria-label="Google account">
                <img src="./unnamed (1).png" alt="Profile">
            </a>
        </nav>
    </header>

    <main class="main-content">
        <h1 class="logo">Google</h1>

        <form class="search-form"
              action="https://www.google.com/search"
              method="get"
              role="search">

            <div class="search-box">
                <button class="icon-button add-button"
                        type="button" aria-label="Add attachment">
                    +
                </button>

                <input
                    type="text"
                    name="q"
                    aria-label="Search Google"
                    autocomplete="off"
                >

                <button class="icon-button" type="button"
                        aria-label="Search by voice">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="9" y="2" width="6" height="12" rx="3"
                              fill="currentColor" stroke="none"/>
                        <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"/>
                    </svg>
                </button>

                <button class="icon-button" type="button"
                        aria-label="Search by image">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5l2-2h4l2 2h3a2 2 0 0 1 2 2v4
                                 M21 17v2a2 2 0 0 1-2 2h-3
                                 M8 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3"/>
                        <circle cx="12" cy="12" r="4"/>
                        <circle cx="20" cy="15" r="1"
                                fill="currentColor" stroke="none"/>
                    </svg>
                </button>

                <button class="ai-button" type="button">
                    <span aria-hidden="true">✧</span>
                    AI Mode
                </button>
            </div>

            <div class="search-buttons">
                <button type="submit">Google Search</button>
                <button type="button">I'm Feeling Lucky</button>
            </div>
        </form>

        <div class="languages">
            <span>Google offered in:</span>
            <a href="#" lang="hi">हिन्दी</a>
            <a href="#" lang="bn">বাংলা</a>
            <a href="#" lang="te">తెలుగు</a>
            <a href="#" lang="mr">मराठी</a>
            <a href="#" lang="ta">தமிழ்</a>
            <a href="#" lang="gu">ગુજરાતી</a>
            <a href="#" lang="kn">ಕನ್ನಡ</a>
            <a href="#" lang="ml">മലയാളം</a>
            <a href="#" lang="pa">ਪੰਜਾਬੀ</a>
        </div>
    </main>

    <footer class="footer">India</footer>
</body>
</html>
